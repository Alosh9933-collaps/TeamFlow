      description: |-
        * `TODO` - To Do
        * `PENDING` - Pending
        * `DONE` - Done
    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time

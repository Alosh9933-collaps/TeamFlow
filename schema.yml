          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        released_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - claimed_at
      - completed_at
      - id
      - released_at
      - task
      - user
    TaskStatusEnum:
      enum:
      - TODO
      - PENDING
      - DONE

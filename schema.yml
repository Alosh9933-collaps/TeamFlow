components:
  schemas:
    ActionEnum:
      enum:
      - CREATED
      - UPDATED
      - DELETED
      - ADDED
      - REMOVED
      - ROLE_CHANGED
      - COMPLETED
      type: string
      description: |-
        * `CREATED` - Created
        * `UPDATED` - Updated
        * `DELETED` - Deleted
        * `ADDED` - Added
        * `REMOVED` - Removed
        * `ROLE_CHANGED` - Role changed
        * `COMPLETED` - Completed
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor_username:
          type: string
          nullable: true
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: integer
          readOnly: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_username
      - created_at
      - id
      - metadata
      - target_id
      - target_type
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        new_password_confirm:
          type: string
          writeOnly: true
      required:
      - new_password
      - new_password_confirm
      - old_password
    ChangePasswordErrorResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ChangePasswordResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    LogoutResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor_username:
          type: string
          nullable: true
          readOnly: true
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: integer
          readOnly: true
        metadata:
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_username
      - created_at
      - id
      - metadata
      - notification_type
      - read_at
      - target_id
      - target_type
    NotificationMarkAllReadResponse:
      type: object
      properties:
        detail:
          type: string
        updated_count:
          type: integer
      required:
      - detail
      - updated_count
    NotificationTypeEnum:
      enum:
      - MEMBER_ADDED
      - ROLE_CHANGED
      - JOIN_REQUEST_APPROVED
      - TASK_ASSIGNED
      - TASK_COMPLETED
      - MEMBER_REMOVED
      type: string
      description: |-
        * `MEMBER_ADDED` - Member added
        * `ROLE_CHANGED` - Role changed
        * `JOIN_REQUEST_APPROVED` - Join request approved
        * `TASK_ASSIGNED` - Task assigned
        * `TASK_COMPLETED` - Task completed
        * `MEMBER_REMOVED` - Member removed
    PaginatedProjectList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PaginatedTaskList:
      type: object
      required:
      - count
